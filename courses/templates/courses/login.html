<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Kdemia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tesoem: { dark: '#006837', light: '#6EB528', taupe: '#9E948A', bg: '#F8F9FA' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#F8FAF8] text-slate-800 min-h-screen flex flex-col justify-center items-center px-4 py-12">

    <div class="max-w-md w-full">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="{% url 'course_list' %}" class="inline-flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-tesoem-dark flex items-center justify-center text-white font-black text-lg shadow-sm">
                    K
                </div>
                <span class="font-extrabold text-2xl text-slate-900 tracking-tight">K<span class="text-tesoem-light">demia</span></span>
            </a>
            <h2 class="text-xl font-bold text-slate-900 mt-4">Iniciar Sesión</h2>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">Ingresa a tu cuenta para continuar con tus cursos</p>
        </div>

        <!-- Tarjeta de Login -->
        <div class="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm">
            {% if messages %}
                {% for message in messages %}
                <div class="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs font-semibold text-rose-800">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Usuario</label>
                    <input type="text" name="username" required placeholder="Tu nombre de usuario" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-tesoem-dark focus:ring-1 focus:ring-tesoem-dark transition-all">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Contraseña</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-tesoem-dark focus:ring-1 focus:ring-tesoem-dark transition-all">
                </div>

                <button type="submit" class="w-full py-2.5 px-4 rounded-xl bg-tesoem-dark hover:bg-emerald-800 text-white font-bold text-sm shadow-sm transition-all mt-2">
                    Entrar a la plataforma
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-500">
                ¿No tienes cuenta? 
                <a href="{% url 'register' %}" class="font-bold text-tesoem-dark hover:underline">Regístrate gratis</a>
            </div>
        </div>
        
        <div class="text-center mt-6">
            <a href="{% url 'course_list' %}" class="text-xs text-slate-400 hover:text-slate-600">&larr; Volver al inicio</a>
        </div>
    </div>

</body>
</html>
